  - name: "账单应收时间"
    field: "billReceivableTime"
    begin_param: "billReceivableTimeBeginStr"
    end_param: "billReceivableTimeEndStr"
    test_values:
      begin: "2026-03-29 00:00:00"
      end: "2026-05-07 23:59:59"

# 组合筛选场景
combinations:
  - name: "全部条件组合"
    desc: "所有筛选条件同时生效"
    params:
      head: "${TEST_CUSTOMER_NAME}"
      locationId: "1919680838326657025"
