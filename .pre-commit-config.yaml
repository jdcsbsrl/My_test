repos:
  - repo: local
    hooks:
      - id: project-structure-audit
        name: project structure audit
        entry: python tools/project_structure_auditor.py --json
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: documentation-consistency-audit
        name: documentation consistency audit
        entry: python tools/doc_consistency_checker.py --json
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: runtime-report-sensitive-audit
        name: runtime report sensitive-artifact audit
        entry: python tools/scan_runtime_reports.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (\.env\.example|docs/|tests/unit/test_audit_agent\.py)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [modules/]
        additional_dependencies: [types-requests, types-PyYAML]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-r, modules/, -c, .bandit, --severity-level, medium]
