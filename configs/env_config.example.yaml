# 环境配置示例文件
# 请复制此文件为 configs/test.yaml 或 configs/uat.yaml 并填入实际配置

# 测试环境配置示例
origin: https://your-test-erp.example.com
ui_path: ''
api_path: '/oms-test-api'

playwright:
  headless: true
  browser: chromium
  slow_mo: 0
  viewport:
    width: 1920
    height: 1080
  video: off
  trace: off

api:
  timeout: 60
  retries: 3
  verify_ssl: true

