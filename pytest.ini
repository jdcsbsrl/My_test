[pytest]
minversion = 8.0
testpaths = testcases tests/unit tests/integration modules/auto_test/testcases modules/auto_test/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:playwright
    --alluredir=reports/allure-results
    --cov=modules/auto_test
    --cov=modules/trae_test
    --cov-report=html:reports/coverage/html
    --cov-report=xml:reports/coverage/coverage.xml
    --cov-report=term
    --cov-fail-under=5
markers =
    regression: marks tests as part of regression suite
    smoke: marks tests as smoke tests
    ui: marks tests as UI/E2E tests
    api: marks tests as API tests
    performance: marks tests as performance tests
    auth: marks tests as authorization/permission tests
    p0: highest priority tests
    p1: medium priority tests
    p2: low priority tests
    slow: marks tests as slow (deselect with '-m not slow')
    e2e: 端到端测试，完整业务流程
    unit: 单元测试，无浏览器依赖
    requirement(id): 标记用例所属的需求ID
filterwarnings =
    ignore::DeprecationWarning
