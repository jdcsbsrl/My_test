name: Test ERP CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install linting tools
        run: pip install "ruff>=0.3.0" "black==24.10.0" "mypy>=1.9.0"
      - name: Ruff code check
        run: ruff check .
        continue-on-error: true
      - name: Black format check
        run: black --check --config pyproject.toml .
        continue-on-error: true
      - name: Mypy type check
        run: mypy modules/
        continue-on-error: true

  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install bandit
      - name: Bandit security scan
        run: bandit -r modules/ -f json -o bandit-report.json --severity-level medium
        continue-on-error: true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json

  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e .
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -n auto --alluredir reports/allure-results
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/

  integration-tests:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e .
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short --alluredir reports/allure-results
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports/

  ui-tests:
    name: UI测试 (分片${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - shard: 1
            test_files: "modules/auto_test/tests/test_login_regression.py modules/auto_test/tests/test_sku_search_regression.py"
          - shard: 2
            test_files: "modules/auto_test/tests/test_sales_export_simple.py modules/auto_test/tests/test_sales_order_export_sort.py"
          - shard: 3
            test_files: "modules/auto_test/tests/test_export_download.py modules/auto_test/tests/test_export_flow_precise.py"
          - shard: 4
            test_files: "modules/auto_test/tests/test_export_full_flow.py modules/auto_test/tests/test_export_system_order_no.py"
          - shard: 5
            test_files: "modules/auto_test/tests/test_export_with_order_data.py modules/auto_test/tests/test_inventory_query_export.py"
          - shard: 6
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py"
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e .
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run UI tests (shard ${{ matrix.shard }})
        run: |
          pytest ${{ matrix.test_files }} -v --tb=short -p no:playwright --alluredir reports/allure-results
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
          TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-shard-${{ matrix.shard }}
          path: reports/
          if-no-files-found: warn

  report:
    name: 生成测试报告
    runs-on: ubuntu-latest
    needs: [security-scan, unit-tests, integration-tests, ui-tests]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION="2.29.0"
          wget -qO- "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" | tar -xz -C /tmp
          echo "/tmp/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
      - name: Download unit test results
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: reports/unit/
        continue-on-error: true
      - name: Download integration test results
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: reports/integration/
        continue-on-error: true
      - name: Download UI test results
        uses: actions/download-artifact@v4
        with:
          pattern: ui-test-results-shard-*
          path: reports/
        continue-on-error: true
      - name: Merge allure-results from all test types
        run: |
          mkdir -p reports/allure-results
          find reports/ -name "allure-results" -type d -exec cp -r {}/* reports/allure-results/ \;
      - name: Generate Allure report
        run: allure generate reports/allure-results -o reports/allure-report
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/

  deploy-test:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: report
    if: success() && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to test environment
        run: echo "部署到测试环境..."