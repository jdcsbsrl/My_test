name: Test ERP CI/CD

on:
  push:
    branches: [ main, fix, clean-branch ]
  pull_request:
    branches: [ main, fix, clean-branch ]
  schedule:
    # GitHub Actions uses UTC; 16:00 UTC is 00:00 the next day in China Standard Time.
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      run_inventory_sync_1004021_order_matrix:
        description: "运行需求1004021订单矩阵只读预检（需配置订单号 secret）"
        required: false
        type: boolean
        default: false
      run_weekly_report_source_audit:
        description: "运行需求1003838周报与源账单对账（仅在周报刷新后使用）"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  # A new push supersedes an older run on the same branch. Including the SHA
  # here creates a new concurrency group for every push and lets stale runs
  # continue against the shared test environment.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-audit:
    name: 项目结构与文档一致性审核
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Run project structure audit
        shell: bash
        run: |
          mkdir -p .runtime/reports
          set +e
          python tools/project_structure_auditor.py --json | tee .runtime/reports/structure-audit.json
          audit_status=${PIPESTATUS[0]}
          if [ "$audit_status" -eq 2 ]; then
            echo "结构审核发现阻断问题"
            exit 2
          fi
          if [ "$audit_status" -eq 1 ]; then
            echo "结构审核仅发现警告，继续执行 CI"
          fi
      - name: Run documentation consistency audit
        run: python tools/doc_consistency_checker.py --json

  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install linting tools
        run: pip install "ruff==0.15.13" "black==26.3.1" "mypy==2.1.0"
      - name: Ruff code check
        run: ruff check .
      - name: Black format check
        run: black --check --config pyproject.toml .
      - name: Mypy type check (advisory)
        run: mypy modules/
        continue-on-error: true
        if: always()

  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install "bandit==1.7.8"
      - name: Bandit security scan
        run: |
          mkdir -p .runtime/reports
          bandit -r modules/ -c .bandit -f json -o .runtime/reports/bandit-report.json --severity-level medium
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: .runtime/reports/bandit-report.json

  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 20
    env:
      TEST_ENV: test
      # CI is an explicitly authorized test-environment execution.
      AUTO_TEST_AUTHORIZED: "true"
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Run unit tests
        run: |
          mkdir -p .runtime/reports/allure-results
          python -c "import allure_pytest; print('allure-pytest loaded:', allure_pytest.__file__)"
          # Unit coverage is measured on unit-testable layers. Browser page
          # objects are covered by the UI matrix below and are intentionally
          # not mixed into this gate.
          pytest tests/unit/ modules/auto_test/tests/test_sales_order_sort_audit.py -v --tb=short -n auto \
            --alluredir .runtime/reports/allure-results \
            --cov=modules/auto_test/core \
            --cov=modules/auto_test/api \
            --cov=modules/auto_test/drivers \
            --cov=modules/auto_test/facades \
            --cov=modules/auto_test/reporting \
            --cov=modules/trae_test/orchestrator \
            --cov=modules/trae_test/utils \
            --cov-report=html:.runtime/reports/coverage/html \
            --cov-report=xml:.runtime/reports/coverage/coverage.xml \
            --cov-report=term \
            --cov-fail-under=60
      - name: Scan unit test artifacts for secrets
        if: always()
        run: |
          mkdir -p .runtime/reports
          python tools/scan_sensitive_artifacts.py .runtime/reports
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-unit
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  integration-tests:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    env:
      TEST_ENV: test
      # CI is an explicitly authorized test-environment execution.
      AUTO_TEST_AUTHORIZED: "true"
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Run integration tests
        run: |
          mkdir -p .runtime/reports/allure-results
          python -c "import allure_pytest; print('allure-pytest loaded:', allure_pytest.__file__)"
          pytest tests/integration/ tests/test_workflow_integration.py tests/test_knowledge_retriever_regression.py -v --tb=short --no-cov --alluredir .runtime/reports/allure-results
      - name: Scan integration test artifacts for secrets
        if: always()
        run: |
          mkdir -p .runtime/reports
          python tools/scan_sensitive_artifacts.py .runtime/reports
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-integration
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  sales-ui-tests:
    name: UI测试 (管理员-销售分片${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 180
    env:
      TEST_ENV: test
      # CI is an explicitly authorized test-environment execution.
      AUTO_TEST_AUTHORIZED: "true"
      # Sales/report tests use the administrator account.  Order-export
      # regression tests requiring the seeded order fixture run in the leader
      # lane below, whose account owns that test data scope.
      TEST_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      TEST_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      WEEKLY_REPORT_ROLE: admin
      # Keep reportSyncQuery focused on the recent, bounded test data window.
      # Query a broad recent window first, then narrow to 15 minutes and use a
      # five-minute safety window only when the test data is still too dense.
      REPORT_SYNC_LOOKBACK_MINUTES: "60,15,5"
    strategy:
      matrix:
        include:
          - shard: 1
            test_files: "modules/auto_test/tests/test_login_regression.py modules/auto_test/tests/test_sku_search_regression.py"
          - shard: 3
            test_files: "modules/auto_test/tests/test_export_download.py"
          - shard: 4
            test_files: "modules/auto_test/tests/test_export_full_flow.py"
          - shard: 11
            test_files: "modules/auto_test/tests/test_report_sync_query_regression.py"
          - shard: 12
            test_files: "modules/auto_test/tests/test_inventory_variant_stock_query.py modules/auto_test/tests/test_inventory_sku_and_group_query.py"
          - shard: 13
            test_files: "modules/auto_test/tests/test_sales_order_fixed_category_1003845.py"
          - shard: 14
            test_files: "modules/auto_test/tests/test_export_requirement_1003531.py -m 'not slow'"
          - shard: 15
            test_files: "modules/auto_test/tests/test_customer_bill_exchange_rate_1003647.py"
          - shard: 16
            test_files: "modules/auto_test/tests/test_weekly_business_report_1003838.py -m 'not slow'"
      fail-fast: false
      # Each runner has an isolated browser; allow two administrator shards
      # while keeping the account lane bounded.
      max-parallel: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Validate administrator credentials are configured
        run: |
          test -n "$TEST_USERNAME" || { echo '缺少 ADMIN_USERNAME secret'; exit 1; }
          test -n "$TEST_PASSWORD" || { echo '缺少 ADMIN_PASSWORD secret'; exit 1; }
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run UI tests (shard ${{ matrix.shard }})
        run: |
          mkdir -p .runtime/reports/allure-results
          python -c "import allure_pytest; print('allure-pytest loaded:', allure_pytest.__file__)"
          # UI tests use Playwright Sync API; pytest-rerunfailures can create
          # an asyncio loop around fixture setup, so UI retries are disabled.
          # The test itself and the framework retain bounded domain retries.
          pytest ${{ matrix.test_files }} -v --tb=short -p no:playwright -p no:asyncio -p no:rerunfailures --no-cov --alluredir .runtime/reports/allure-results
      - name: Scan UI test artifacts for secrets
        if: always()
        run: |
          mkdir -p .runtime/reports
          python tools/scan_sensitive_artifacts.py .runtime/reports
        env:
          TEST_ENV: test
          TEST_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          TEST_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
          TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-admin-shard-${{ matrix.shard }}
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  weekly-report-role-regression:
    name: 业务组周报权限回归（${{ matrix.role }}）
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: manager
          - role: sales
      max-parallel: 2
    env:
      TEST_ENV: test
      AUTO_TEST_AUTHORIZED: "true"
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      LEADER_USERNAME: ${{ secrets.LEADER_USERNAME }}
      LEADER_PASSWORD: ${{ secrets.LEADER_PASSWORD }}
      SALES_USERNAME: ${{ secrets.SALES_USERNAME }}
      SALES_PASSWORD: ${{ secrets.SALES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Validate weekly-report role credentials
        shell: bash
        run: |
          test -n "$ADMIN_USERNAME" || { echo '缺少 ADMIN_USERNAME secret'; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo '缺少 ADMIN_PASSWORD secret'; exit 1; }
          case "${{ matrix.role }}" in
            manager)
              test -n "$LEADER_USERNAME" || { echo '缺少 LEADER_USERNAME secret'; exit 1; }
              test -n "$LEADER_PASSWORD" || { echo '缺少 LEADER_PASSWORD secret'; exit 1; }
              ;;
            sales)
              test -n "$SALES_USERNAME" || { echo '缺少 SALES_USERNAME secret'; exit 1; }
              test -n "$SALES_PASSWORD" || { echo '缺少 SALES_PASSWORD secret'; exit 1; }
              ;;
            *) echo '未知周报权限角色'; exit 2 ;;
          esac
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Run read-only weekly-report role checks
        shell: bash
        run: |
          mkdir -p .runtime/reports/allure-results .runtime/cache
          case "${{ matrix.role }}" in
            manager) TEST_USERNAME="$LEADER_USERNAME"; TEST_PASSWORD="$LEADER_PASSWORD" ;;
            sales) TEST_USERNAME="$SALES_USERNAME"; TEST_PASSWORD="$SALES_PASSWORD" ;;
          esac
          export TEST_USERNAME TEST_PASSWORD WEEKLY_REPORT_ROLE="${{ matrix.role }}"
          pytest modules/auto_test/tests/test_weekly_business_report_1003838.py \
            -k 'test_report_tabs_and_customer_searches_are_available or test_work_plan_selector_is_scoped_to_the_configured_role' \
            -v --tb=short -p no:playwright -p no:asyncio -p no:rerunfailures --no-cov \
            --basetemp ".runtime/cache/weekly-report-${{ matrix.role }}" \
            --alluredir .runtime/reports/allure-results
      - name: Scan weekly-report role artifacts for secrets
        if: always()
        run: python tools/scan_sensitive_artifacts.py .runtime/reports
        env:
          TEST_USERNAME: ${{ matrix.role == 'manager' && secrets.LEADER_USERNAME || secrets.SALES_USERNAME }}
          TEST_PASSWORD: ${{ matrix.role == 'manager' && secrets.LEADER_PASSWORD || secrets.SALES_PASSWORD }}
      - name: Upload weekly-report role results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-weekly-report-${{ matrix.role }}
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  weekly-report-source-audit:
    name: 业务组周报源账单对账（手动）
    if: github.event_name == 'workflow_dispatch' && inputs.run_weekly_report_source_audit
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 60
    env:
      TEST_ENV: test
      AUTO_TEST_AUTHORIZED: "true"
      TEST_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      TEST_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      WEEKLY_REPORT_ROLE: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Validate administrator credentials
        run: |
          test -n "$TEST_USERNAME" || { echo '缺少 ADMIN_USERNAME secret'; exit 1; }
          test -n "$TEST_PASSWORD" || { echo '缺少 ADMIN_PASSWORD secret'; exit 1; }
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Run read-only source-bill reconciliation
        run: |
          mkdir -p .runtime/reports/allure-results
          pytest modules/auto_test/tests/test_weekly_business_report_1003838.py::test_latest_week_admin_reports_match_source_receivable_bills \
            -m slow -v --tb=short -p no:playwright -p no:asyncio -p no:rerunfailures --no-cov \
            --alluredir .runtime/reports/allure-results
      - name: Scan weekly-report source-audit artifacts for secrets
        if: always()
        run: python tools/scan_sensitive_artifacts.py .runtime/reports
        env:
          TEST_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          TEST_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
          TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      - name: Upload weekly-report source-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-weekly-report-source-audit
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  sales-volume-window:
    name: 商品销量报表固定数据窗口
    runs-on: ubuntu-latest
    outputs:
      as_of_date: ${{ steps.anchor.outputs.as_of_date }}
    steps:
      - name: Resolve run date in Asia Shanghai
        id: anchor
        run: echo "as_of_date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

  sales-volume-regression:
    name: 商品销量报表回归（泳道${{ matrix.lane }}）
    runs-on: ubuntu-latest
    needs: [code-quality, sales-volume-window]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: A
          - lane: B
          - lane: C
      max-parallel: 3
    env:
      TEST_ENV: test
      AUTO_TEST_AUTHORIZED: 'true'
      SALES_VOLUME_AS_OF_DATE: ${{ needs.sales-volume-window.outputs.as_of_date }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      LEADER_USERNAME: ${{ secrets.LEADER_USERNAME }}
      LEADER_PASSWORD: ${{ secrets.LEADER_PASSWORD }}
      SALES_USERNAME: ${{ secrets.SALES_USERNAME }}
      SALES_PASSWORD: ${{ secrets.SALES_PASSWORD }}
      ASSISTANT_USERNAME: ${{ secrets.ASSISTANT_USERNAME }}
      ASSISTANT_PASSWORD: ${{ secrets.ASSISTANT_PASSWORD }}
      PROCUREMENT_USERNAME: ${{ secrets.PROCUREMENT_USERNAME }}
      PROCUREMENT_PASSWORD: ${{ secrets.PROCUREMENT_PASSWORD }}
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Run assigned roles independently
        run: |
          mkdir -p .runtime/reports/allure-results .runtime/cache
          overall=0
          counter=0
          run_phase() {
            local phase="$1"
            shift
            counter=$((counter + 1))
            echo "::group::$SALES_VOLUME_ROLE - $phase"
            if pytest "$@" -v --tb=short -p no:playwright -p no:asyncio -p no:rerunfailures --no-cov --basetemp ".runtime/cache/sales-volume-${SALES_VOLUME_ROLE}-${counter}" --alluredir .runtime/reports/allure-results; then
              echo "| $SALES_VOLUME_ROLE | $phase | 通过 |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $SALES_VOLUME_ROLE | $phase | 失败或不完整 |" >> "$GITHUB_STEP_SUMMARY"
              overall=1
            fi
            echo '::endgroup::'
          }
          printf '| 角色 | 检查 | 结果 |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          case "${{ matrix.lane }}" in
            A) roles=(admin) ;;
            B) roles=(sales procurement) ;;
            C) roles=(manager assistant) ;;
            *) echo "未知商品销量报表泳道: ${{ matrix.lane }}"; exit 2 ;;
          esac
          for role in "${roles[@]}"; do
            case "$role" in
              admin) TEST_USERNAME="$ADMIN_USERNAME"; TEST_PASSWORD="$ADMIN_PASSWORD" ;;
              manager) TEST_USERNAME="$LEADER_USERNAME"; TEST_PASSWORD="$LEADER_PASSWORD" ;;
              sales) TEST_USERNAME="$SALES_USERNAME"; TEST_PASSWORD="$SALES_PASSWORD" ;;
              assistant) TEST_USERNAME="$ASSISTANT_USERNAME"; TEST_PASSWORD="$ASSISTANT_PASSWORD" ;;
              procurement) TEST_USERNAME="$PROCUREMENT_USERNAME"; TEST_PASSWORD="$PROCUREMENT_PASSWORD" ;;
            esac
            export TEST_USERNAME TEST_PASSWORD
            export SALES_VOLUME_ROLE="$role"
            if [ -z "$TEST_USERNAME" ] || [ -z "$TEST_PASSWORD" ]; then
              echo "| $role | 凭据检查 | 缺失，未执行 |" >> "$GITHUB_STEP_SUMMARY"
              overall=1
              continue
            fi
            counter=0
            if [ "$role" = admin ]; then
              export SALES_VOLUME_ROLE=admin
              run_phase 完整主回归 modules/auto_test/tests/test_sales_volume_regression.py modules/auto_test/tests/test_sales_volume_role_regression.py modules/auto_test/tests/test_sales_volume_sort_regression.py -m 'not slow'
              run_phase 慢速排序与导出 modules/auto_test/tests/test_sales_volume_regression.py modules/auto_test/tests/test_sales_volume_sort_regression.py -m slow
              continue
            fi
            run_phase 权限 modules/auto_test/tests/test_sales_volume_role_regression.py -m 'not slow'
            common='test_time_filter_requires_at_least_one_time or test_payment_and_shipping_time_filters or test_half_year_time_boundary or test_sku_filters_and_invalid_inputs or test_sku_sales_range_filters or test_create_time_filter_limits_result or test_supplier_name_filter_matches_rows or test_custom_class_filter_matches_rows or test_dimension_specific_filter or test_warehouse_expand_keeps_every_sku'
            if [ "$role" != procurement ]; then
              common="$common or test_dimension_accepts_payment_range or test_filtered_pagination_and_sales_total or test_ui_multistore_search_and_reset or test_store_single_select_and_clear or test_multistore_expand_sales_matches_sku_list or test_multistore_category_detail_sales or test_multistore_sku_sales_against_order_items or test_multistore_inventory_against_inventory_api or test_bundle_order_sample_is_available"
            else
              common="$common or (test_dimension_accepts_payment_range and not store)"
            fi
            run_phase 筛选与来源对账 modules/auto_test/tests/test_sales_volume_regression.py -k "$common" -m 'not slow'
            if [ "$role" = procurement ]; then
              run_phase 采购来源对账 modules/auto_test/tests/test_sales_volume_role_regression.py -k test_procurement_source_data
              echo '| procurement | 双店筛选 | 不适用：无店铺权限 |' >> "$GITHUB_STEP_SUMMARY"
            fi
            run_phase 排序与导出 modules/auto_test/tests/test_sales_volume_sort_regression.py -m slow
            if [ "$role" != procurement ]; then
              run_phase 多店异步导出 modules/auto_test/tests/test_sales_volume_regression.py -k async_export -m slow
              run_phase 越权店铺 modules/auto_test/tests/test_sales_volume_role_regression.py -k test_role_denied_store_with_administrator_sold_sample -m slow
            else
              run_phase 采购异步导出 modules/auto_test/tests/test_sales_volume_role_regression.py -k test_procurement_async_export_matches_query -m slow
              run_phase 采购管理员对账 modules/auto_test/tests/test_sales_volume_role_regression.py -k test_procurement_data_matches_administrator -m slow
            fi
          done
          exit "$overall"
      - name: Scan role test artifacts for secrets
        id: scan_sales_volume_artifacts
        if: always()
        run: |
          mkdir -p .runtime/reports
          result=0
          for role in admin manager sales assistant procurement; do
            case "$role" in
              admin) TEST_USERNAME="$ADMIN_USERNAME"; TEST_PASSWORD="$ADMIN_PASSWORD" ;;
              manager) TEST_USERNAME="$LEADER_USERNAME"; TEST_PASSWORD="$LEADER_PASSWORD" ;;
              sales) TEST_USERNAME="$SALES_USERNAME"; TEST_PASSWORD="$SALES_PASSWORD" ;;
              assistant) TEST_USERNAME="$ASSISTANT_USERNAME"; TEST_PASSWORD="$ASSISTANT_PASSWORD" ;;
              procurement) TEST_USERNAME="$PROCUREMENT_USERNAME"; TEST_PASSWORD="$PROCUREMENT_PASSWORD" ;;
            esac
            export TEST_USERNAME TEST_PASSWORD
            python tools/scan_sensitive_artifacts.py .runtime/reports || result=1
          done
          exit "$result"
      - name: Upload role test results
        uses: actions/upload-artifact@v4
        if: always() && steps.scan_sales_volume_artifacts.outcome == 'success'
        with:
          name: allure-results-sales-volume-lane-${{ matrix.lane }}
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  inventory-tests:
    name: UI测试 (组长业务分片${{ matrix.shard }})
    runs-on: ubuntu-latest
    # This lane has its own account. It may run in parallel with the
    # administrator sales/report lane, but its own shards remain serial.
    needs: code-quality
    timeout-minutes: 90
    env:
      TEST_ENV: test
      AUTO_TEST_AUTHORIZED: "true"
      # Inventory pages, order exports, and pagination regression use the
      # business-group-leader account, which owns the seeded order fixture.
      TEST_USERNAME: ${{ secrets.LEADER_USERNAME }}
      TEST_PASSWORD: ${{ secrets.LEADER_PASSWORD }}
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
    strategy:
      matrix:
        include:
          - shard: 5
            test_files: "modules/auto_test/tests/test_export_with_order_data.py modules/auto_test/tests/test_inventory_query_export.py modules/auto_test/tests/test_sales_export_simple.py modules/auto_test/tests/test_sales_order_export_sort.py modules/auto_test/tests/test_export_flow_precise.py modules/auto_test/tests/test_export_system_order_no.py"
          - shard: 6
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k TestInventorySKUSearch"
          - shard: 7
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py modules/auto_test/tests/test_pagination_requirement_1004106.py -k \"TestInventorySKUSelectAll or TestInventorySKUPagination or test_sales_order_pagination or test_platform_exception_pagination\""
          - shard: 8
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k \"TestInventorySKUPageSize or TestInventorySKUExport\""
          - shard: 9
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k \"TestInventorySKUExportFields or TestInventorySKUIntegration\""
          - shard: 10
            test_files: "modules/auto_test/tests/test_inventory_sync_requirement_1004021.py"
      fail-fast: false
      # Group-leader shards share the account and backend data scope.
      # Allow two isolated runners at a time while keeping the lane bounded.
      max-parallel: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Validate business-group-leader credentials are configured
        run: |
          test -n "$TEST_USERNAME" || { echo '缺少 LEADER_USERNAME secret'; exit 1; }
          test -n "$TEST_PASSWORD" || { echo '缺少 LEADER_PASSWORD secret'; exit 1; }
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run inventory UI tests (shard ${{ matrix.shard }})
        run: |
          mkdir -p .runtime/reports/allure-results
          python -c "import allure_pytest; print('allure-pytest loaded:', allure_pytest.__file__)"
          pytest ${{ matrix.test_files }} -v --tb=short -p no:playwright -p no:asyncio -p no:rerunfailures --no-cov --alluredir .runtime/reports/allure-results
      - name: Run inventory sync 1004021 order matrix preflight
        if: >-
          matrix.shard == 10 && github.event_name == 'workflow_dispatch' &&
          inputs.run_inventory_sync_1004021_order_matrix
        env:
          INVENTORY_SYNC_ORDER_NUMBERS: ${{ secrets.INVENTORY_SYNC_ORDER_NUMBERS }}
        run: |
          test -n "$INVENTORY_SYNC_ORDER_NUMBERS" || { echo '缺少 INVENTORY_SYNC_ORDER_NUMBERS secret'; exit 1; }
          pytest modules/auto_test/tests/test_inventory_sync_order_matrix_1004021.py \
            -v --tb=short -p no:playwright -p no:asyncio -p no:rerunfailures \
            --no-cov --alluredir .runtime/reports/allure-results
      - name: Check sales order delivery status filters (group leader)
        if: matrix.shard == 5 && success()
        run: python -m modules.auto_test delivery-status-regression --env test --execute --page-size 500 --max-pages 100
      - name: Scan group-leader UI test artifacts for secrets
        id: scan_leader_artifacts
        if: always()
        run: |
          mkdir -p .runtime/reports
          python tools/scan_sensitive_artifacts.py .runtime/reports
        env:
          TEST_ENV: test
          TEST_USERNAME: ${{ secrets.LEADER_USERNAME }}
          TEST_PASSWORD: ${{ secrets.LEADER_PASSWORD }}
      - name: Upload group-leader UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-leader-shard-${{ matrix.shard }}
          path: .runtime/reports/allure-results/
          if-no-files-found: warn
      - name: Upload delivery status regression report
        if: always() && matrix.shard == 5 && steps.scan_leader_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sales-order-delivery-status-leader
          path: .runtime/reports/sales_order_delivery_status/*.json
          if-no-files-found: warn
  report:
    name: 生成测试报告
    runs-on: ubuntu-latest
    needs: [security-scan, unit-tests, integration-tests, sales-ui-tests, weekly-report-role-regression, weekly-report-source-audit, sales-volume-regression, inventory-tests]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION="2.29.0"
          wget -qO- "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" | tar -xz -C /tmp
          echo "/tmp/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
      - name: Download and merge Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: .runtime/reports/allure-results/
      - name: Scan merged Allure results for secrets
        run: |
          mkdir -p .runtime/reports/allure-results
          python tools/scan_sensitive_artifacts.py .runtime/reports/allure-results
      - name: Validate Allure results
        run: |
          RESULT_COUNT=$(find .runtime/reports/allure-results -name '*-result.json' -type f | wc -l)
          echo "Allure result files: ${RESULT_COUNT}"
          if [ "${RESULT_COUNT}" -eq 0 ]; then
            echo "未生成 Allure 结果，跳过报告生成；请查看上游测试 job 的原始错误。"
            exit 0
          fi
      - name: Generate Allure report
        run: |
          RESULT_COUNT=$(find .runtime/reports/allure-results -name '*-result.json' -type f | wc -l)
          if [ "${RESULT_COUNT}" -eq 0 ]; then
            echo "没有可生成的 Allure 结果，跳过报告生成。"
            exit 0
          fi
          allure generate .runtime/reports/allure-results -o .runtime/reports/allure-report
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: .runtime/reports/allure-report/
          if-no-files-found: warn

  deploy-test-stub:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: report
    if: success() && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to test environment
        run: echo "部署到测试环境..."

  collect-failure-logs:
    name: 收集失败日志
    runs-on: ubuntu-latest
    needs: [structure-audit, code-quality, security-scan, unit-tests, integration-tests, sales-ui-tests, weekly-report-role-regression, weekly-report-source-audit, sales-volume-regression, inventory-tests, report, deploy-test-stub]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download logs from failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          report_dir=".runtime/reports/ci-failure-logs"
          mkdir -p "$report_dir"
          printf '仓库：%s\n工作流：Test ERP CI/CD\n运行 ID：%s\n详情：https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$RUN_ID" "$GITHUB_REPOSITORY" "$RUN_ID" \
            > "$report_dir/run-info.txt"
          if gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$report_dir/failed-jobs.log"; then
            echo '失败 Job 日志已下载。' | tee "$GITHUB_STEP_SUMMARY"
          else
            echo 'GitHub 未返回失败 Job 日志，请打开运行详情查看。' | tee "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate CI metrics report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          report_dir=".runtime/reports/ci-failure-logs"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            > "$report_dir/jobs.json"
          python tools/generate_ci_metrics_report.py \
            --jobs "$report_dir/jobs.json" \
            --logs "$report_dir/failed-jobs.log" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" \
            --markdown "$report_dir/ci-metrics-report.md" \
            --json "$report_dir/ci-metrics-report.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Download each failed job log and annotations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          report_dir=".runtime/reports/ci-failure-logs"
          python - "$report_dir/jobs.json" "$report_dir" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          jobs_path = Path(sys.argv[1])
          report_dir = Path(sys.argv[2])
          repository = sys.argv[3]
          jobs = json.loads(jobs_path.read_text(encoding="utf-8")).get("jobs", [])
          failed = [job for job in jobs if job.get("conclusion") == "failure"]
          combined_path = report_dir / "failed-jobs.log"
          combined_path.write_text("", encoding="utf-8")
          summary = ["# 失败 Job 明细", ""]
          for job in failed:
              job_id = str(job.get("id"))
              safe_name = re.sub(r"[^A-Za-z0-9._-]+", "_", str(job.get("name", job_id))).strip("_") or job_id
              log_path = report_dir / f"job-{job_id}-{safe_name}.log"
              annotation_path = report_dir / f"job-{job_id}-{safe_name}-annotations.json"
              log_result = subprocess.run(
                  [
                      "curl",
                      "-fsSL",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                      "-H",
                      "X-GitHub-Api-Version: 2022-11-28",
                      f"https://api.github.com/repos/{repository}/actions/jobs/{job_id}/logs",
                      "-o",
                      str(log_path),
                  ],
                  check=False,
                  capture_output=True,
              )
              if log_result.returncode != 0:
                  log_path.write_bytes(log_result.stderr)
              with combined_path.open("a", encoding="utf-8") as combined:
                  combined.write(f"\n===== {job.get('name', job_id)} ({job_id}) =====\n")
                  combined.write(log_path.read_text(encoding="utf-8", errors="replace"))
              annotation_result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/check-runs/{job_id}/annotations"],
                  check=False,
                  capture_output=True,
              )
              annotation_path.write_bytes(annotation_result.stdout)
              failed_steps = [
                  step.get("name", "未命名步骤")
                  for step in job.get("steps", [])
                  if step.get("conclusion") == "failure"
              ]
              summary.append(f"## {job.get('name', job_id)}")
              summary.append(f"- Job ID：`{job_id}`")
              summary.append(f"- 失败步骤：{'、'.join(failed_steps) or '未识别'}")
              summary.append(f"- 原始日志：`{log_path.name}`")
              summary.append(f"- Annotations：`{annotation_path.name}`")
              summary.append(f"- 日志下载退出码：`{log_result.returncode}`")
              summary.append("")
          if not failed:
              summary.extend(["未识别到失败 Job。", ""])
          (report_dir / "failed-jobs-summary.md").write_text("\n".join(summary), encoding="utf-8")
          PY

      - name: Regenerate CI metrics report with downloaded logs
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          report_dir=".runtime/reports/ci-failure-logs"
          python tools/generate_ci_metrics_report.py \
            --jobs "$report_dir/jobs.json" \
            --logs "$report_dir/failed-jobs.log" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" \
            --markdown "$report_dir/ci-metrics-report.md" \
            --json "$report_dir/ci-metrics-report.json" \
            > "$GITHUB_STEP_SUMMARY"

      - name: Upload failed job logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-failure-logs-${{ github.run_id }}
          path: .runtime/reports/ci-failure-logs
          if-no-files-found: warn
          retention-days: 14
