name: Test ERP CI/CD

on:
  push:
    branches: [ main, fix, clean-branch ]
  pull_request:
    branches: [ main, fix, clean-branch ]
  schedule:
    # GitHub Actions uses UTC; 16:00 UTC is 00:00 the next day in China Standard Time.
    - cron: '0 16 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  # A new push supersedes an older run on the same branch. Including the SHA
  # here creates a new concurrency group for every push and lets stale runs
  # continue against the shared test environment.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-audit:
    name: 项目结构与文档一致性审核
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Run project structure audit
        shell: bash
        run: |
          mkdir -p .runtime/reports
          set +e
          python tools/project_structure_auditor.py --json | tee .runtime/reports/structure-audit.json
          audit_status=${PIPESTATUS[0]}
          if [ "$audit_status" -eq 2 ]; then
            echo "结构审核发现阻断问题"
            exit 2
          fi
          if [ "$audit_status" -eq 1 ]; then
            echo "结构审核仅发现警告，继续执行 CI"
          fi
      - name: Run documentation consistency audit
        run: python tools/doc_consistency_checker.py --json

  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install linting tools
        run: pip install "ruff==0.15.13" "black==26.3.1" "mypy==2.1.0"
      - name: Ruff code check
        run: ruff check .
      - name: Black format check
        run: black --check --config pyproject.toml .
      - name: Mypy type check (advisory)
        run: mypy modules/
        continue-on-error: true
        if: always()

  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install "bandit==1.7.8"
      - name: Bandit security scan
        run: bandit -r modules/ -c .bandit -f json -o bandit-report.json --severity-level medium
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json

  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 20
    env:
      TEST_ENV: test
      # CI is an explicitly authorized test-environment execution.
      AUTO_TEST_AUTHORIZED: "true"
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py
      - name: Run unit tests
        run: |
          mkdir -p .runtime/reports/allure-results
          python -c "import allure_pytest; print('allure-pytest loaded:', allure_pytest.__file__)"
          # Unit coverage is measured on unit-testable layers. Browser page
          # objects are covered by the UI matrix below and are intentionally
          # not mixed into this gate.
          pytest tests/unit/ -v --tb=short -n auto \
            --alluredir .runtime/reports/allure-results \
            --cov=modules/auto_test/core \
            --cov=modules/auto_test/api \
            --cov=modules/auto_test/drivers \
            --cov=modules/auto_test/facades \
            --cov=modules/auto_test/reporting \
            --cov=modules/trae_test/orchestrator \
            --cov=modules/trae_test/utils \
            --cov-report=html:.runtime/reports/coverage/html \
            --cov-report=xml:.runtime/reports/coverage/coverage.xml \
            --cov-report=term \
            --cov-fail-under=60
      - name: Scan unit test artifacts for secrets
        if: always()
        run: |
          mkdir -p .runtime/reports
          python tools/scan_sensitive_artifacts.py .runtime/reports
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-unit
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  integration-tests:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    env:
      TEST_ENV: test
      # CI is an explicitly authorized test-environment execution.
      AUTO_TEST_AUTHORIZED: "true"
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py
      - name: Run integration tests
        run: |
          mkdir -p .runtime/reports/allure-results
          python -c "import allure_pytest; print('allure-pytest loaded:', allure_pytest.__file__)"
          pytest tests/integration/ tests/test_workflow_integration.py tests/test_knowledge_retriever_regression.py -v --tb=short --no-cov --alluredir .runtime/reports/allure-results
      - name: Scan integration test artifacts for secrets
        if: always()
        run: |
          mkdir -p .runtime/reports
          python tools/scan_sensitive_artifacts.py .runtime/reports
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-integration
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  sales-ui-tests:
    name: UI测试 (管理员-销售分片${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 90
    env:
      TEST_ENV: test
      # CI is an explicitly authorized test-environment execution.
      AUTO_TEST_AUTHORIZED: "true"
      # Sales/report tests include the large-data export scenario, so use the
      # administrator account with the broadest data visibility.
      TEST_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      TEST_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      # Keep reportSyncQuery focused on the recent, bounded test data window.
      # Query a broad recent window first, then narrow to 15 minutes and use a
      # five-minute safety window only when the test data is still too dense.
      REPORT_SYNC_LOOKBACK_MINUTES: "60,15,5"
    strategy:
      matrix:
        include:
          - shard: 1
            test_files: "modules/auto_test/tests/test_login_regression.py modules/auto_test/tests/test_sku_search_regression.py"
          - shard: 2
            test_files: "modules/auto_test/tests/test_sales_export_simple.py modules/auto_test/tests/test_sales_order_export_sort.py"
          - shard: 3
            test_files: "modules/auto_test/tests/test_export_download.py modules/auto_test/tests/test_export_flow_precise.py"
          - shard: 4
            test_files: "modules/auto_test/tests/test_export_full_flow.py modules/auto_test/tests/test_export_system_order_no.py"
          - shard: 10
            test_files: "modules/auto_test/tests/test_sales_report_regression.py"
          - shard: 11
            test_files: "modules/auto_test/tests/test_report_sync_query_regression.py"
      fail-fast: false
      # Keep the administrator account single-threaded. The inventory lane
      # uses a different account and can run at the same time.
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Validate administrator credentials are configured
        run: |
          test -n "$TEST_USERNAME" || { echo '缺少 ADMIN_USERNAME secret'; exit 1; }
          test -n "$TEST_PASSWORD" || { echo '缺少 ADMIN_PASSWORD secret'; exit 1; }
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run UI tests (shard ${{ matrix.shard }})
        run: |
          mkdir -p .runtime/reports/allure-results
          python -c "import allure_pytest; print('allure-pytest loaded:', allure_pytest.__file__)"
          # UI tests use Playwright Sync API; pytest-rerunfailures can create
          # an asyncio loop around fixture setup, so UI retries are disabled.
          # The test itself and the framework retain bounded domain retries.
          pytest ${{ matrix.test_files }} -v --tb=short -p no:playwright -p no:asyncio -p no:rerunfailures --no-cov --alluredir .runtime/reports/allure-results
      - name: Scan UI test artifacts for secrets
        if: always()
        run: |
          mkdir -p .runtime/reports
          python tools/scan_sensitive_artifacts.py .runtime/reports
        env:
          TEST_ENV: test
          TEST_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          TEST_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
          TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-admin-shard-${{ matrix.shard }}
          path: .runtime/reports/allure-results/
          if-no-files-found: warn

  inventory-tests:
    name: UI测试 (组长-库存分片${{ matrix.shard }})
    runs-on: ubuntu-latest
    # This lane has its own account. It may run in parallel with the
    # administrator sales/report lane, but its own shards remain serial.
    needs: code-quality
    timeout-minutes: 90
    env:
      TEST_ENV: test
      AUTO_TEST_AUTHORIZED: "true"
      # Inventory pages do not require system-administrator permissions.
      # Use the business-group-leader account to keep data scope separate.
      TEST_USERNAME: ${{ secrets.LEADER_USERNAME }}
      TEST_PASSWORD: ${{ secrets.LEADER_PASSWORD }}
      TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
    strategy:
      matrix:
        include:
          - shard: 5
            test_files: "modules/auto_test/tests/test_export_with_order_data.py modules/auto_test/tests/test_inventory_query_export.py"
          - shard: 6
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k TestInventorySKUSearch"
          - shard: 7
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k \"TestInventorySKUSelectAll or TestInventorySKUPagination\""
          - shard: 8
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k \"TestInventorySKUPageSize or TestInventorySKUExport\""
          - shard: 9
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k \"TestInventorySKUExportFields or TestInventorySKUIntegration\""
      fail-fast: false
      # Inventory shards share the group-leader account and backend data scope.
      # Run them one at a time without a concurrency group, so GitHub does not
      # discard queued shards.
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Validate CI endpoints
        run: python tools/validate_ci_environment.py --require-ui
      - name: Validate business-group-leader credentials are configured
        run: |
          test -n "$TEST_USERNAME" || { echo '缺少 LEADER_USERNAME secret'; exit 1; }
          test -n "$TEST_PASSWORD" || { echo '缺少 LEADER_PASSWORD secret'; exit 1; }
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run inventory UI tests (shard ${{ matrix.shard }})
        run: |
          mkdir -p .runtime/reports/allure-results
          python -c "import allure_pytest; print('allure-pytest loaded:', allure_pytest.__file__)"
          pytest ${{ matrix.test_files }} -v --tb=short -p no:playwright -p no:asyncio -p no:rerunfailures --no-cov --alluredir .runtime/reports/allure-results
      - name: Scan inventory UI test artifacts for secrets
        if: always()
        run: |
          mkdir -p .runtime/reports
          python tools/scan_sensitive_artifacts.py .runtime/reports
        env:
          TEST_ENV: test
          TEST_USERNAME: ${{ secrets.LEADER_USERNAME }}
          TEST_PASSWORD: ${{ secrets.LEADER_PASSWORD }}
      - name: Upload inventory UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-leader-shard-${{ matrix.shard }}
          path: .runtime/reports/allure-results/
          if-no-files-found: warn
  report:
    name: 生成测试报告
    runs-on: ubuntu-latest
    needs: [security-scan, unit-tests, integration-tests, sales-ui-tests, inventory-tests]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION="2.29.0"
          wget -qO- "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" | tar -xz -C /tmp
          echo "/tmp/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
      - name: Download and merge Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: .runtime/reports/allure-results/
      - name: Scan merged Allure results for secrets
        run: |
          mkdir -p .runtime/reports/allure-results
          python tools/scan_sensitive_artifacts.py .runtime/reports/allure-results
      - name: Validate Allure results
        run: |
          RESULT_COUNT=$(find .runtime/reports/allure-results -name '*-result.json' -type f | wc -l)
          echo "Allure result files: ${RESULT_COUNT}"
          if [ "${RESULT_COUNT}" -eq 0 ]; then
            echo "未生成 Allure 结果，跳过报告生成；请查看上游测试 job 的原始错误。"
            exit 0
          fi
      - name: Generate Allure report
        run: |
          RESULT_COUNT=$(find .runtime/reports/allure-results -name '*-result.json' -type f | wc -l)
          if [ "${RESULT_COUNT}" -eq 0 ]; then
            echo "没有可生成的 Allure 结果，跳过报告生成。"
            exit 0
          fi
          allure generate .runtime/reports/allure-results -o .runtime/reports/allure-report
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: .runtime/reports/allure-report/
          if-no-files-found: warn

  deploy-test-stub:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: report
    if: success() && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to test environment
        run: echo "部署到测试环境..."

  collect-failure-logs:
    name: 收集失败日志
    runs-on: ubuntu-latest
    needs: [structure-audit, code-quality, security-scan, unit-tests, integration-tests, sales-ui-tests, inventory-tests, report, deploy-test-stub]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download logs from failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          report_dir=".runtime/reports/ci-failure-logs"
          mkdir -p "$report_dir"
          printf '仓库：%s\n工作流：Test ERP CI/CD\n运行 ID：%s\n详情：https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$RUN_ID" "$GITHUB_REPOSITORY" "$RUN_ID" \
            > "$report_dir/run-info.txt"
          if gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$report_dir/failed-jobs.log"; then
            echo '失败 Job 日志已下载。' | tee "$GITHUB_STEP_SUMMARY"
          else
            echo 'GitHub 未返回失败 Job 日志，请打开运行详情查看。' | tee "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate CI metrics report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          report_dir=".runtime/reports/ci-failure-logs"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            > "$report_dir/jobs.json"
          python tools/generate_ci_metrics_report.py \
            --jobs "$report_dir/jobs.json" \
            --logs "$report_dir/failed-jobs.log" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" \
            --markdown "$report_dir/ci-metrics-report.md" \
            --json "$report_dir/ci-metrics-report.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed job logs
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-${{ github.run_id }}
          path: .runtime/reports/ci-failure-logs
          if-no-files-found: warn
          retention-days: 14
