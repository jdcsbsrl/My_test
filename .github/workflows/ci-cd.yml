name: Test ERP CI/CD

on:
  push:
    branches: [ main, clean-branch ]
  pull_request:
    branches: [ main, clean-branch ]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install linting tools
        run: pip install "ruff>=0.3.0" "black==24.10.0" "mypy>=1.9.0"
      - name: Ruff code check
        run: ruff check .
        continue-on-error: true
      - name: Black format check
        run: black --check --config pyproject.toml .
        continue-on-error: true
      - name: Mypy type check
        run: mypy modules/
        continue-on-error: true

  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install bandit
      - name: Bandit security scan
        run: bandit -r modules/ -f json -o bandit-report.json --severity-level medium
        continue-on-error: true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json

  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Run unit tests
        run: >
          pytest tests/unit/ -v --tb=short -n auto --alluredir reports/allure-results
          --cov=modules/auto_test --cov=modules/trae_test
          --cov-report=html:reports/coverage/html
          --cov-report=xml:reports/coverage/coverage.xml
          --cov-report=term
          --cov-fail-under=60
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-unit
          path: reports/allure-results/
          if-no-files-found: error

  integration-tests:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short --no-cov --alluredir reports/allure-results
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-integration
          path: reports/allure-results/
          if-no-files-found: error

  ui-tests:
    name: UI测试 (分片${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - shard: 1
            test_files: "modules/auto_test/tests/test_login_regression.py modules/auto_test/tests/test_sku_search_regression.py"
          - shard: 2
            test_files: "modules/auto_test/tests/test_sales_export_simple.py modules/auto_test/tests/test_sales_order_export_sort.py"
          - shard: 3
            test_files: "modules/auto_test/tests/test_export_download.py modules/auto_test/tests/test_export_flow_precise.py"
          - shard: 4
            test_files: "modules/auto_test/tests/test_export_full_flow.py modules/auto_test/tests/test_export_system_order_no.py"
          - shard: 5
            test_files: "modules/auto_test/tests/test_export_with_order_data.py modules/auto_test/tests/test_inventory_query_export.py"
          - shard: 6
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k TestInventorySKUSearch"
          - shard: 7
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k \"TestInventorySKUSelectAll or TestInventorySKUPagination\""
          - shard: 8
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k \"TestInventorySKUPageSize or TestInventorySKUExport\""
          - shard: 9
            test_files: "modules/auto_test/tests/test_inventory_sku_system.py -k \"TestInventorySKUExportFields or TestInventorySKUIntegration\""
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -e . "pytest>=8,<9"
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run UI tests (shard ${{ matrix.shard }})
        run: |
          pytest ${{ matrix.test_files }} -v --tb=short -p no:playwright --no-cov --alluredir reports/allure-results
        env:
          TEST_ENV: test
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_WEB_BASE_URL: ${{ secrets.TEST_WEB_BASE_URL }}
          TEST_WEB_API_BASE_URL: ${{ secrets.TEST_WEB_API_BASE_URL }}
      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui-shard-${{ matrix.shard }}
          path: reports/allure-results/
          if-no-files-found: error
      - name: Upload UI diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-diagnostics-shard-${{ matrix.shard }}
          path: |
            reports/screenshots/
            reports/traces/
            reports/videos/
          if-no-files-found: ignore

  report:
    name: 生成测试报告
    runs-on: ubuntu-latest
    needs: [security-scan, unit-tests, integration-tests, ui-tests]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION="2.29.0"
          wget -qO- "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" | tar -xz -C /tmp
          echo "/tmp/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
      - name: Download and merge Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: reports/allure-results/
      - name: Validate Allure results
        run: |
          RESULT_COUNT=$(find reports/allure-results -name '*-result.json' -type f | wc -l)
          echo "Allure result files: ${RESULT_COUNT}"
          test "${RESULT_COUNT}" -gt 0
      - name: Generate Allure report
        run: allure generate reports/allure-results -o reports/allure-report
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/

  deploy-test:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: report
    if: success() && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to test environment
        run: echo "部署到测试环境..."
