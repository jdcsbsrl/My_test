name: ERP 17TRACK Daily

on:
  # 07:31 UTC = 15:31 Asia/Shanghai. GitHub may start scheduled jobs late.
  schedule:
    - cron: '31 7 * * *'
  workflow_dispatch:
  # Allow a trial run from fix before this workflow reaches the default branch.
  push:
    branches:
      - fix
    paths:
      - .github/workflows/erp-17track-daily.yml
      - modules/auto_test/core/logistics_tracking_*.py
      - tools/*logistics_tracking*.py

permissions:
  actions: read
  contents: read

concurrency:
  group: erp-17track-daily
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ERP_PROD_USERNAME: ${{ secrets.ERP_PROD_USERNAME }}
      ERP_PROD_PASSWORD: ${{ secrets.ERP_PROD_PASSWORD }}
      ERP_17TRACK_HISTORY_KEY: ${{ secrets.ERP_17TRACK_HISTORY_KEY }}
      ERP_17TRACK_PRIOR_HASHES: ${{ secrets.ERP_17TRACK_PRIOR_HASHES }}
      ERP_17TRACK_PUBLIC_CI: '1'
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Check required secrets without displaying them
        shell: bash
        run: |
          for name in ERP_PROD_USERNAME ERP_PROD_PASSWORD ERP_17TRACK_HISTORY_KEY QQ_SMTP_AUTH_CODE REPORT_EMAIL_TO; do
            if [ -z "${!name}" ]; then
              echo "Missing required Actions secret: $name" >&2
              exit 2
            fi
          done

      - name: Install runtime dependencies
        run: |
          python -m pip install \
            'requests>=2.32' 'python-dotenv>=1.0' 'playwright>=1.50' \
            'PyYAML>=6.0.1' 'loguru>=0.7.2' 'faker>=23.0.0' \
            'pydantic>=2.6.0' 'psycopg2-binary>=2.9'
          python -m playwright install --with-deps chromium

      - name: Verify logistics entrypoint imports
        run: |
          python -c 'import modules.auto_test.core.logistics_tracking_daily'
          python -c 'import modules.auto_test.core.logistics_tracking_email'

      - name: Restore the latest complete hash history
        shell: bash
        run: |
          mkdir -p .runtime/cache/logistics_tracking_archive
          run_id="$(gh run list \
            --workflow erp-17track-daily.yml --branch "$GITHUB_REF_NAME" --status success \
            --json databaseId --limit 1 --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo 'No successful cloud history exists yet.'
          else
            if ! gh run download "$run_id" -n logistics-tracking-hmac-history \
                -D .runtime/cache/logistics_tracking_archive; then
              echo 'Latest history artifact unavailable; stopping to avoid duplicate sampling.' >&2
              exit 2
            fi
            if [ ! -f .runtime/cache/logistics_tracking_archive/history.json ]; then
              echo 'Downloaded history has no manifest.' >&2
              exit 2
            fi
          fi

      - name: Compare ten real tracking numbers
        id: compare
        continue-on-error: true
        run: python tools/run_logistics_tracking_daily.py

      - name: Email full report directly to owner
        id: email
        if: always() && steps.compare.outcome != 'skipped'
        run: python tools/send_logistics_tracking_email.py

      - name: Upload keyed hash history only
        if: steps.compare.outcome == 'success' && steps.email.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: logistics-tracking-hmac-history
          path: .runtime/cache/logistics_tracking_archive/history.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve comparison and email failures
        if: always() && (steps.compare.outcome == 'failure' || steps.email.outcome == 'failure')
        run: exit 2
