[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-erp"
version = "1.0.0"
description = "ERP 测试平台 - 整合 trae_test 和 auto_test"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Test ERP Team"},
]
keywords = ["automation", "testing", "playwright", "pytest", "api", "performance", "erp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # 核心测试框架
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-html>=4.1.0",
    "pytest-rerunfailures>=14.0.0",
    "allure-pytest>=2.13.0",
    # UI 测试
    "pytest-playwright>=0.5.0",
    "playwright>=1.50.0",
    # API 测试
    "requests>=2.32.0",
    "requests-toolbelt>=1.0.0",
    "pydantic>=2.6.0",
    "jsonschema>=4.21.0",
    # 性能测试
    "locust>=2.24.0",
    # 数据处理
    "PyYAML>=6.0.1",
    "openpyxl>=3.1.2",
    "faker>=23.0.0",
    # 配置和环境
    "python-dotenv>=1.0.0",
    # 数据库
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    # 缓存
    "redis>=5.0",
    # 日志和报告
    "loguru>=0.7.2",
    # 代码质量
    "ruff==0.15.13",
    "black==26.3.1",
    "mypy==2.1.0",
    # 其他扩展
    "pytest-bdd>=7.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "commitizen>=3.15.0",
]
ci = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/jdcsbsrl/My_test"
Repository = "https://github.com/jdcsbsrl/My_test"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "modules.trae_test*",
    "modules.auto_test*",
    "fixtures*",
]
exclude = ["modules.auto_test.tests*"]
namespaces = true

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 120
cache-dir = ".runtime/cache/ruff"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
]
ignore = [
    "E402",  # module-import-not-at-top-of-file
    "E501",  # line too long, handled by black
    "E722",  # bare except
    "F841",  # unused variable
    "F821",  # undefined name
    "F822",  # undefined name in __all__
]
per-file-ignores = { "__init__.py" = ["F401"], "modules/auto_test/testcases/**/*.py" = ["S101"], "testcases/**/*.py" = ["S101"] }

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "modules.auto_test.testcases.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "testcases.*"
disallow_untyped_defs = false


